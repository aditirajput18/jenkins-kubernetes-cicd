
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-assessment-app
  labels:
    app: cicd-assessment-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-assessment-app
  template:
    metadata:
      labels:
        app: cicd-assessment-app
    spec:
      containers:
        - name: flask-app
          image: jenkins-kubernetes-cicd:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
